<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="cyokozai">
  <!-- 塗りのタイルにする。タブバーが明色でも暗色でも輪郭が保たれる。 -->
  <rect width="32" height="32" rx="7" fill="#2C3E50"/>
  <!-- cyokozai の c。16px でも潰れないよう太いストロークで開口を右に取る。 -->
  <path d="M21.3 10.7A7.5 7.5 0 1 0 21.3 21.3"
        fill="none" stroke="#00AFCC" stroke-width="4.5" stroke-linecap="round"/>
  <!-- サブアクセント。開口を埋めて 16px でも「c」の向きが読み取れるようにする。 -->
  <circle cx="24.6" cy="16" r="2.3" fill="#F6C745"/>
</svg>
