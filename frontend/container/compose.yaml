name: portfolio-frontend

services:
  frontend:
    build:
      context: ..
      dockerfile: container/Dockerfile
    volumes:
      # モノレポ全体をマウント（backend と対称）
      - ../..:/workspace:cached
      - node_modules:/workspace/frontend/node_modules
    ports:
      - "5173:5173" # Vite
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: sleep infinity

volumes:
  node_modules:
