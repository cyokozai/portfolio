# main への push で本番イメージを GHCR へ載せ、deploy/ のタグを書き戻す。
# 実際のクラスタへの反映は ArgoCD が deploy/ の差分を見て行う（push 型のデプロイはしない）。
name: cd

on:
  push:
    branches:
      - main
    # このワークフロー自身が deploy/ を書き換えてコミットを戻すため、
    # 除外しないと自分の書き戻しで自分が起動し、無限に自走する。
    paths-ignore:
      - 'deploy/**'

# 連続 push でタグの書き戻しが競合しないよう直列化する。
# 途中で打ち切ると push 済みイメージとマニフェストがずれるので中断はしない。
concurrency:
  group: cd
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/cyokozai/portfolio
  # kustomize は ubuntu ランナーに同梱されていない。
  # サードパーティ action を増やさず、公式リリースの tarball を取得して使う。
  KUSTOMIZE_VERSION: v5.7.1

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # deploy/ へタグを書き戻すため
      packages: write # GHCR へ push するため
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # タグは latest ではなく git sha にする。
      # latest だとマニフェストに差分が出ず、ArgoCD が同期すべき変更を検知できない。
      - name: イメージをビルドして GHCR へ push
        uses: docker/build-push-action@v6
        with:
          # frontend と backend の両方が要るためコンテキストはリポジトリルート。
          context: .
          file: container/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: kustomize を取得
        run: |
          curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin kustomize
          kustomize version

      - name: deploy/ のイメージタグを書き戻す
        run: |
          cd deploy
          kustomize edit set image "${IMAGE}:${GITHUB_SHA}"
          cd ..

          # 差分が無ければ何もしない（空コミットを積まない）。
          if git diff --quiet -- deploy; then
            echo "タグに変化なし。コミットしない。"
            exit 0
          fi

          # author を bot 相当に揃え、人間のコミットと区別できるようにする。
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add deploy
          # paths-ignore に加えた二重の保険。
          # さらに GITHUB_TOKEN による push はワークフローを起動しないため、防御は三重になる。
          git commit -m "chore: イメージタグを ${GITHUB_SHA} へ更新 [skip ci]"
          git push origin HEAD:main
