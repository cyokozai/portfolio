# VM 上の k3s に「アプリより下のレイヤ」を入れるための helmfile。
#
# 責務の分界:
#   helmfile … day-0。ArgoCD 本体・cloudflared など、クラスタの土台
#   ArgoCD   … day-2。アプリ本体（deploy/）の同期
#
# ArgoCD が ArgoCD 自身を管理する循環を避けるため、ここに portfolio は含めない。
#
# metrics-server は k3s に同梱されているため入れていない。
# `--disable metrics-server` で無効化している場合のみ、下部の該当リリースを有効化する。
#
# 実行（VM 上）:
#   helmfile -f platform/helmfile.yaml diff
#   helmfile -f platform/helmfile.yaml apply

repositories:
  - name: argo
    url: https://argoproj.github.io/argo-helm
  - name: cloudflare
    url: https://cloudflare.github.io/helm-charts

environments:
  default:
    values:
      # 公開ドメイン。Cloudflare で管理しているものに置き換える
      - domain: CHANGE_ME.example.com
      # ArgoCD が同期するリポジトリ
      - repoURL: https://github.com/cyokozai/portfolio.git
      # cloudflared が接続するトンネル
      - tunnelName: portfolio
      - tunnelId: CHANGE_ME
      - accountId: CHANGE_ME
      # トンネル認証情報を保持する Secret 名。
      # この Secret はリポジトリに置かず、VM 上で kubectl から直接作成する
      # （手順は platform/README.md を参照）
      - tunnelSecretName: cloudflare-tunnel-credentials
      # cloudflared の宛先となる Ingress Controller。
      # k3s 同梱の Traefik（kube-system/traefik:80）。
      # アプリの Service は直接指さず、経路は deploy/ingress.yaml に持たせる。
      - ingressNamespace: kube-system
      - ingressService: traefik
      - ingressPort: 80

---

helmDefaults:
  wait: true
  timeout: 600
  atomic: true

releases:
  - name: argocd
    namespace: argocd
    createNamespace: true
    chart: argo/argo-cd
    version: 10.4.0
    values:
      - values/argocd.yaml.gotmpl

  - name: cloudflare-tunnel
    namespace: cloudflare
    createNamespace: true
    chart: cloudflare/cloudflare-tunnel
    version: 0.3.2
    values:
      - values/cloudflare-tunnel.yaml.gotmpl
    # トンネルが指す先が先に存在している必要はないが、
    # ArgoCD より後に入れて依存の向きを揃える
    needs:
      - argocd/argocd

  # k3s の metrics-server を無効化している場合のみ有効化する。
  # HPA は resource metrics が無いと TARGETS が <unknown> のままになる。
  # - name: metrics-server
  #   namespace: kube-system
  #   chart: metrics-server/metrics-server
  #   version: 3.12.2
  #   installed: false
