apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: portfolio
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/cyokozai/portfolio.git
    targetRevision: main
    path: deploy
  destination:
    server: https://kubernetes.default.svc
    namespace: portfolio
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - PrunePropagationPolicy=foreground
  ignoreDifferences:
    # レプリカ数は HPA が持つ。この除外が無いと selfHeal が
    # スケールアウトを差分と見て戻し、HPA と綱引きになる。
    - group: apps
      kind: Deployment
      name: portfolio
      namespace: portfolio
      jsonPointers:
        - /spec/replicas
