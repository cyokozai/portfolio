apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: portfolio

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - ingress.yaml

# GitHub Actions が `kustomize edit set image` でタグを差し替え、
# その差分を ArgoCD が同期する。
# latest は使わない（差分が出ず ArgoCD が同期しないため）。
images:
  - name: ghcr.io/cyokozai/portfolio
    newTag: latest
