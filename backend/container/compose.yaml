name: portfolio-backend

services:
  backend:
    build:
      context: ..
      dockerfile: container/Dockerfile
    volumes:
      # モノレポ全体をマウント（将来 go:embed で frontend/dist を参照できるように）
      - ../..:/workspace:cached
      # Go モジュールキャッシュは named volume で永続化
      - gomodcache:/go/pkg/mod
    ports:
      - "8080:8080" # Go API Server
    command: sleep infinity

volumes:
  gomodcache:
